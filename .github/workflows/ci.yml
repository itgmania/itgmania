on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

name: Continuous integration

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, macos-14, macos-26, windows-2025, windows-2022]
        include:
          - os: ubuntu-24.04
            name: Ubuntu 24.04 (x86_64)
          - os: ubuntu-24.04-arm
            name: Ubuntu 24.04 (ARM)
          - os: ubuntu-22.04
            name: Ubuntu 22.04 (x86_64)
          - os: ubuntu-22.04-arm
            name: Ubuntu 22.04 (ARM)
          - os: macos-15
            name: macOS 15 (M1)
            flags: -DCMAKE_OSX_ARCHITECTURES=arm64
          - os: macos-15-intel
            name: macOS 15 (Intel)
            flags: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: macos-14
            name: macOS 14 (ARM)
            flags: -DCMAKE_OSX_ARCHITECTURES=arm64
          - os: macos-26
            name: macOS 26 (Intel)
            flags: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: windows-2025
            name: Windows 2025
          - os: windows-2022
            name: Windows 2022
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl-dev libglu1-mesa-dev libgtk-3-dev libjack-dev libmad0-dev libpulse-dev libudev-dev libxinerama-dev libx11-dev libxrandr-dev libxtst-dev nasm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Set Parallel Jobs
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "JOBS=$(nproc)" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "JOBS=$(sysctl -n hw.logicalcpu)" >> $GITHUB_ENV
          else
            echo "JOBS=$NUMBER_OF_PROCESSORS" >> $GITHUB_ENV
          fi

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Configure
        run: >
          cmake -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON 
          -DWITH_FFMPEG_JOBS="${{ env.JOBS }}" 
          ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --parallel "${{ env.JOBS }}"
